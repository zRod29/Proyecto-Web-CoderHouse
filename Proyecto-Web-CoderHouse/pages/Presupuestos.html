    <main class="bienvenidop">
      <section id="sobre-mi" aria-label="Información personal de Ezequiel Rodriguez">
        <h1 class="subtitulo animate__animated animate__pulse"> Solicitá tu cotización</h1>
      </section>
      <section class="cotizacion">
        <h4> Completá los datos de tu proyecto para que podamos conocer qué trabajo necesitás.</h4>
            <form>
                <label for="nombre">Nombre y apellido</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 351 1234567" required>
                <label for="servicio">Tipo de trabajo</label>
                <select id="servicio" name="servicio" required>
                    <option value="">Seleccioná una opción</option>
                    <option value="rejas">Rejas</option>
                    <option value="portones">Portones</option>
                    <option value="barandas">Barandas</option>
                    <option value="escaleras">Escaleras</option>
                    <option value="estructuras">Pergolas Estructurales</option>
                    <option value="otro">Otro</option>
                </select>
                <label for="medidas">Medidas aproximadas</label>
                <input type="text" id="medidas" name="medidas" placeholder="Ej: 2 m de ancho x 1,5 m de alto">
                <label for="descripcion">Descripción del proyecto</label>
                <textarea id="descripcion" name="descripcion" rows="6" placeholder="Contanos qué trabajo necesitás realizar"></textarea>
                <a class="boton-whatsapp" href="https://wa.me/3772564776?text=Hola%2C%20quiero%20solicitar%20una%20cotizaci%C3%B3n%20para%20un%20trabajo%20de%20herrer%C3%ADa."
                    target="_blank">
                    📱 Solicitar cotización por WhatsApp
                </a>
            </form>
        </section>
